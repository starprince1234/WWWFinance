version: '3.8'

services:
  dapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ethercrowd_dapp
    ports:
      - "8080:8080"
      - "8545:8545"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

